<!DOCTYPE html>
<html>
<head>
    <title>かるた大会 同期再生</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        #players-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .player-wrapper {
            position: relative;
            width: 48%;
            padding-top: 27%; /* 16:9 Aspect Ratio */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #controls {
            text-align: center;
        }
        button {
            font-size: 1.2em;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>かるた大会 同期再生</h1>

    <div id="players-container">
        <div class="player-wrapper">
            <div id="player1"></div>
        </div>
        <div class="player-wrapper">
            <div id="player2"></div>
        </div>
    </div>

    <div id="controls">
        <button id="play-button" disabled>準備中...</button>
        <button id="pause-button">一時停止</button>
        <button id="stop-button">停止</button>
        <button id="resync-button">再同期して再生</button>
    </div>

    <script>
        // 1. YouTube IFrame Player APIの非同期読み込み
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player1, player2;
        var player1Ready = false;
        var player2Ready = false;

        // 2. APIコードがダウンロードされた後にこの関数が呼び出される
        function onYouTubeIframeAPIReady() {
            player1 = new YT.Player('player1', {
                videoId: 'nfNR2DO8_4E',
                playerVars: {
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayer1Ready,
                }
            });

            player2 = new YT.Player('player2', {
                videoId: 'NFZXoLd8byM',
                playerVars: {
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayer2Ready,
                }
            });
        }

        // 3. 各プレーヤーの準備ができたら呼び出される
        function onPlayer1Ready(event) {
            player1Ready = true;
            checkPlayersReady();
        }
        function onPlayer2Ready(event) {
            event.target.mute(); // 右側の動画をミュート
            player2Ready = true;
            checkPlayersReady();
        }
        
        // 4. 両方のプレーヤーの準備ができているか確認
        function checkPlayersReady() {
            if (player1Ready && player2Ready) {
                var playButton = document.getElementById('play-button');
                playButton.disabled = false;
                playButton.textContent = '再生開始';

                // 再同期ボタンによってリロードされたか確認
                if (sessionStorage.getItem('autoplayOnLoad') === 'true') {
                    sessionStorage.removeItem('autoplayOnLoad'); // フラグを消費
                    player1.playVideo();
                    player2.playVideo();
                }
            }
        }

        // 5. ボタンのイベントリスナー
        document.getElementById('play-button').addEventListener('click', function() {
            player1.playVideo();
            player2.playVideo();
        });

        document.getElementById('pause-button').addEventListener('click', function() {
            player1.pauseVideo();
            player2.pauseVideo();
        });

        document.getElementById('stop-button').addEventListener('click', function() {
            player1.stopVideo();
            player2.stopVideo();
        });

        document.getElementById('resync-button').addEventListener('click', function() {
            // 自動再生のためのフラグを立ててリロード
            sessionStorage.setItem('autoplayOnLoad', 'true');

            location.reload();
        });

    </script>

</body>
</html>
