<!DOCTYPE html>
<html>
<head>
    <title>競技かるた 第72期名人位・第70期クイーン位 決定戦 同期再生</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        #players-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .player-wrapper {
            position: relative;
            width: 49%;
            padding-top: 27.5%; /* 16:9 Aspect Ratio for 49% width */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #000;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #controls {
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            font-size: 1.1em;
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }

        /* Responsive Design for smartphones */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            h1 {
                font-size: 1.2em;
            }
            #players-container {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .player-wrapper {
                width: 98%;
                padding-top: 55.125%; /* 16:9 Aspect Ratio for 98% width */
            }
            button {
                font-size: 1em;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <h1>競技かるた 第72期名人位・第70期クイーン位 決定戦 同期再生 v0.6</h1>

    <div id="players-container">
        <div class="player-wrapper">
            <div id="player1"></div>
        </div>
        <div class="player-wrapper">
            <div id="player2"></div>
        </div>
    </div>

    <div id="controls">
        <button id="resync-button">同期して再生</button>
        <button id="pause-button">一時停止</button>
    </div>

    <footer>
        <p>映像がずれて来たら「同期して再生」を再度押してください。</p>
        <p>MacのChoromeとSafari、AndroidのChromeで動作確認しています。</p>
        <p style="margin-top: 10px;">
            <a href="https://www.unryu.org/" target="_blank" rel="noopener noreferrer">
                by Kazutaka Kurihara, Tsuda University
            </a>
        </p>
    </footer>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player1, player2;
        var player1Ready = false;
        var player2Ready = false;

        function onYouTubeIframeAPIReady() {
            player1 = new YT.Player('player1', {
                videoId: 'nfNR2DO8_4E',
                playerVars: { 'playsinline': 1, 'autoplay': 1, 'mute': 1 },
                events: { 'onReady': onPlayer1Ready }
            });

            player2 = new YT.Player('player2', {
                videoId: 'NFZXoLd8byM',
                playerVars: { 'playsinline': 1, 'autoplay': 1, 'mute': 1 },
                events: { 'onReady': onPlayer2Ready }
            });
        }

        function onPlayer1Ready(event) {
            player1Ready = true;
            checkAndPlay();
        }

        function onPlayer2Ready(event) {
            event.target.mute();
            player2Ready = true;
            checkAndPlay();
        }
        
        function checkAndPlay() {
            if (player1Ready && player2Ready) {
                // First, ensure both videos are playing (they should be already, but this is safe)
                player1.playVideo();
                player2.playVideo();
                // Then, attempt to unmute the first player.
                player1.unMute();
            }
        }

        document.getElementById('resync-button').addEventListener('click', function() {
            location.reload();
        });

        document.getElementById('pause-button').addEventListener('click', function() {
            if (player1 && player1.pauseVideo) {
                player1.pauseVideo();
            }
            if (player2 && player2.pauseVideo) {
                player2.pauseVideo();
            }
        });
    </script>

</body>
</html>
